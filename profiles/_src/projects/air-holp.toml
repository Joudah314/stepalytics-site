updated = '2026-10-25'
title = 'Air-HOLP and the AirScreen R package'
summary = 'Feature screening is a fast first step for data with **far more features than observations**, such as gene expression: it ranks the features and keeps a short list that aims to hold every feature that truly matters. Ridge-HOLP screens well when **features are highly correlated**, but it depends on a penalty, and the best value differs from one dataset to the next. Choosing it the usual way, by cross-validation over a grid of values, means re-running the method many times, and random data splits can change which features are kept. **Air-HOLP selects the penalty adaptively and efficiently**: it updates it from the data, with no grid and no random splits, at the same time complexity as Ridge-HOLP.'
second = 'Published as first author in *Statistics and Computing* (2025), with Samuel Müller and Houying Zhu, and released as the AirScreen R package on CRAN. Tested across a large range of simulation settings and on prostate cancer gene-expression data.'
meta = 'Published 2025 · R · feature screening · simulation and real data'
description = 'Air-HOLP, Ibrahim Joudah’s feature screening method for high-dimensional correlated data (Statistics and Computing, 2025): selecting the ridge penalty adaptively and efficiently, the simulation and prostate cancer results, and the AirScreen R package.'
figure_credit = 'Figure from Joudah, Müller and Zhu (2025), Statistics and Computing, CC BY 4.0.'
