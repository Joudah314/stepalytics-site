updated = '2026-10-25'
title = 'Air-HOLP and the AirScreen R package'
summary = 'When a dataset has thousands of possible predictors, such as genes, but only a few of them affect the outcome, **feature screening** ranks all the predictors and keeps a short list that should contain every one that matters, so a model can then be built from far fewer. Ridge-HOLP screens well even when predictors are **highly correlated**, but only with a well-chosen penalty, and choosing it by cross-validation means re-running the method many times. **Air-HOLP selects the penalty from the data, adaptively and efficiently.**'
meta = 'Published as first author in *Statistics and Computing* (2025) and released as the AirScreen R package on CRAN.'
description = 'Air-HOLP, Ibrahim Joudah’s feature screening method for high-dimensional correlated data (Statistics and Computing, 2025): selecting the ridge penalty adaptively and efficiently, the simulation and prostate cancer results, and the AirScreen R package.'
figure_credit = 'Figure from Joudah, Müller and Zhu (2025), Statistics and Computing, CC BY 4.0.'
