glance = [
	{ value = '40% higher · 12% lower', text = 'sure screening probability than Ridge-HOLP across **2,800 simulation settings**; equal in the other 48%' },
	{ value = 'Best on prostate cancer data', text = 'its genes predict each of the four stages best; for prostate cancer, multiple R **0.85** vs 0.80 (Ridge-HOLP) and 0.70 (SIS)' },
	{ value = 'On CRAN', text = '**AirScreen**, an R package implementing the method' },
]
sections = [
	{ id = 'problem', heading = 'The problem: correlated predictors, and a penalty to choose', text = 'In data such as gene expression, there can be far more predictors (features) than observations, and they are often highly correlated. Screening should keep every **true feature**, one that really affects the outcome, while dropping most of the rest; a method that does this with probability approaching 1 as the sample grows has the **sure screening property**. The challenges:', points = [
		'**One at a time fails under correlation.** Sure Independence Screening (SIS) ranks each feature by its own correlation with the outcome, so it can perform poorly when features are highly correlated.',
		'**Joint screening needs a penalty.** HOLP (Wang and Leng, 2016) looks at all the features together; Ridge-HOLP adds a ridge penalty r for stability, but the best r differs from one dataset to the next.',
		'**Choosing it is slow.** Cross-validation over a grid re-runs Ridge-HOLP (grid size × k) times: 100 values and 10 folds mean 1,000 runs, and leave-one-out needs (grid size × n).',
		'**And unstable.** Cross-validation splits the data at random, and different splits can lead to different screened features.',
	] },
	{ id = 'method', heading = 'The method: Air-HOLP updates the penalty from the data', text = 'Air-HOLP (adaptive iterative ridge-HOLP) chooses the penalty that best predicts the noise-free signal, the part of the response the features explain. That signal is unknown, so Air-HOLP estimates it and repeats:', points = [
		'**Start** from the recommended penalty r = 10 and compute Ridge-HOLP.',
		'**Screen** the top ⌈n/log(n)⌉ features and fit a least-squares regression on them; its fitted values estimate the noise-free signal.',
		'**Update** the penalty to the value that best predicts that estimate, solved with Newton’s method within the range that keeps the sure screening property.',
		'**Repeat** until the penalty changes by less than 1%. In most simulations this took 3 to 6 iterations.',
	], after = 'The costly step, an eigendecomposition, is computed once and reused in every iteration: no grid of penalties, no data splitting, and the same answer on every run.' },
	{ id = 'adapt', heading = 'In one setting low penalties win, in the other high penalties win; Air-HOLP does well in both', chart = 'figure_set', legend = 'Tap a setting to show its chart', caption = 'Figure 1(a) and 1(b): sure screening probability as the correlation between features rises. Ridge-HOLP is shown with four fixed penalties, r = 10, 50, 200 and 600; Air-HOLP selects its own.', panels = [
		{ label = 'Setting 1|low penalties do best', title = 'Setting 1: low penalties do best', sub = 'n = 125 observations, p = 250 features, 9 true features, R² = 0.95', src = 'fig1a.png', height = 448, alt = 'Sure screening probability against correlation in Setting 1: Air-HOLP is at the top with r = 10 and r = 50; r = 200, r = 600 and SIS are lower.' },
		{ label = 'Setting 2|high penalties do best', title = 'Setting 2: high penalties do best', sub = 'n = 1,000 observations, p = 1,250 features, 15 true features, R² = 0.5', src = 'fig1b.png', height = 448, alt = 'Sure screening probability against correlation in Setting 2: Air-HOLP is at the top with r = 200 and r = 600; r = 10, r = 50 and SIS are lower.' },
	], measures = [
		{ term = 'Sure screening probability', text = 'the share of the 500 simulated datasets in which all the true features are among the top ⌈n/log(n)⌉ screened features. Higher is better.' },
		{ term = 'Penalty r', text = 'the ridge tuning parameter of Ridge-HOLP, fixed in advance; Air-HOLP selects it from the data.' },
		{ term = 'Correlation (ρ)', text = 'the correlation between every pair of features in the simulated data.' },
	], text = 'Small penalties (r = 10, 50) do well in Setting 1 but not in Setting 2, and large ones (r = 200, 600) the opposite; Air-HOLP does well in both. SIS works best when features are uncorrelated but poorly when they are highly correlated.' },
	{ id = 'prostate', heading = 'Applied to prostate cancer: better at predicting each stage', chart = 'figure_set', grid = 'quad', legend = 'Tap a stage to show its chart', caption = 'Figure 4: the largest multiple R for models of 1 to 8 genes, chosen from the 21 genes each method screened, for each stage.', panels = [
		{ label = 'Benign epithelium', src = 'fig4a.png', alt = 'Benign epithelium: maximum multiple R against model size; Air-HOLP highest from 4 genes on.' },
		{ label = 'Intraepithelial neoplasia', src = 'fig4b.png', alt = 'Prostatic intraepithelial neoplasia: maximum multiple R against model size; Air-HOLP highest from 3 genes on.' },
		{ label = 'Prostate cancer', src = 'fig4c.png', alt = 'Prostate cancer: maximum multiple R against model size; Air-HOLP highest, SIS levels off lowest.' },
		{ label = 'Metastatic disease', src = 'fig4d.png', alt = 'Metastatic disease: maximum multiple R against model size; Air-HOLP and Ridge-HOLP close together, above SIS.' },
	], measures = [
		{ term = 'Multiple R', text = 'the correlation between the stage (yes or no) and a model’s fitted values, from 0 to 1. For a fixed number of genes it ranks models the same way as R², the likelihood and in-sample prediction error. Higher is better.' },
		{ term = 'Model size', text = 'the number of genes in the model; for each size, the best combination of the 21 screened genes is shown.' },
	], lead = 'Simulations show how a method behaves when the truth is known; real data shows it works in practice.', text = 'The Tomlins-V2 prostate cancer data (Tomlins et al., 2006) has 92 samples and 1,288 genes from four stages of the disease:', points = [
		'**Benign epithelium:** normal, healthy prostate cells.',
		'**Prostatic intraepithelial neoplasia:** early changes in cells that might become cancer.',
		'**Prostate cancer:** actual cancer cells.',
		'**Metastatic disease:** cancer cells that have spread to other parts of the body.',
	], after = 'For each stage, each method screened 21 genes. Ridge-HOLP and Air-HOLP outperform SIS, especially for larger models, because the genes are correlated in this dataset; and Air-HOLP consistently outperforms Ridge-HOLP.' },
	{ id = 'overall', heading = 'Across 2,800 settings, Air-HOLP matched or improved on Ridge-HOLP', chart = 'figures', caption = 'Figure 2: sure screening probability by sample size n and number of features p (correlation 0.6, 6 true features, R² = 0.5). Left: Air-HOLP; middle: Ridge-HOLP with r = 10; right: the difference.', panels = [
		{ src = 'fig2.png', alt = 'Three heat maps of sure screening probability over n and p for Air-HOLP, Ridge-HOLP and their difference; the largest differences are where n is close to p.', width = 1200, height = 350 },
	], text = 'The simulations varied the sample size, the number of features, the correlation and how it is structured, the number of true features and the signal strength (R²), giving 2,800 settings. Air-HOLP’s sure screening probability was **higher in 40%** of them and **lower in 12%**; in the other 48% the two were equal, typically when both probabilities were 0 or 1. When all the features are correlated (1,600 settings), it was higher in 45% and lower in 8%. The gap is most pronounced when n is close to p (for example n = 1,000 and p = 1,250), but it can still be significant elsewhere (n = 500, p = 1,250).' },
	{ id = 'threshold', heading = 'Fewer features needed to keep all the true ones', chart = 'figure_set', legend = 'Tap to choose a chart', caption = 'Figure 3: the sure screening threshold, on a log scale, for Air-HOLP and Ridge-HOLP (r = 10). The dashed line is the screening cut-off ⌈n/log(n)⌉; values below it are runs in which all the true features were screened in.', panels = [
		{ label = 'By signal strength (R²)', title = 'By signal strength (R²)', sub = 'n = 500, p = 1,250, correlation 0.6, 12 true features', src = 'fig3a.png', alt = 'Box plots of the log sure screening threshold against theoretical R squared for Air-HOLP and Ridge-HOLP; both fall as R squared rises, Air-HOLP lower.' },
		{ label = 'By number of true features', title = 'By number of true features', sub = 'n = 1,000, p = 5,000, correlation 0.3, R² = 0.25', src = 'fig3b.png', alt = 'Box plots of the log sure screening threshold against the number of true features for Air-HOLP and Ridge-HOLP; both rise with more true features, Air-HOLP lower.' },
	], measures = [
		{ term = 'Sure screening threshold', text = 'the smallest short list that keeps every true feature, which is the worst rank among them. If three true features rank 37, 12 and 54, the threshold is 54, because 54 features must be kept to include all three. Lower is better.' },
	], text = 'Screening gets easier as R² rises and harder as the number of true features grows. Air-HOLP consistently outperforms Ridge-HOLP across most settings of both.' },
	{ id = 'speed', heading = 'Fast: the same time complexity as Ridge-HOLP', chart = 'figure_set', legend = 'Tap to choose a chart', caption = 'Figure 5: execution time of Air-HOLP, Ridge-HOLP and ordinary ridge regression (Ridge-OLS), over 10 simulations.', panels = [
		{ label = 'Time against features', title = 'Time against the number of features', sub = 'log execution time in milliseconds', src = 'fig5a.png', alt = 'Line chart of log execution time against the number of features: Ridge-OLS rises steeply, Air-HOLP and Ridge-HOLP rise slowly.' },
		{ label = 'Air-HOLP vs Ridge-HOLP', title = 'Air-HOLP against Ridge-HOLP', sub = 'execution time in seconds', src = 'fig5b.png', alt = 'Box plot of execution time in seconds for Air-HOLP and Ridge-HOLP.' },
	], text = 'The eigendecomposition is the only step that costs O(n²p + n³), and it is not repeated; every other step costs O(np + n²) or less, so Air-HOLP has the same time complexity as Ridge-HOLP. Both are considerably faster than ordinary ridge regression when p is much larger than n, and Air-HOLP takes roughly twice as long as a single Ridge-HOLP run with a fixed penalty, where cross-validation over a grid would multiply that run by the grid size × k.' },
	{ id = 'software', heading = 'Use it: the AirScreen R package', text = 'AirScreen implements Air-HOLP for p ≥ n and its counterpart Air-OLS for n > p, through one function, `Air()`, which also runs Ridge-HOLP with a fixed penalty for comparison. The example below is the package’s own.', code = '''install.packages("AirScreen")
library(AirScreen)

set.seed(314)
X <- matrix(rnorm(100000), nrow = 200, ncol = 500)    # 200 observations, 500 features
y <- X[, 1] + X[, 2] + X[, 3] + X[, 4] + 3*rnorm(200)  # features 1 to 4 are the true ones
result <- Air(X, y, penalty_type = "both")  # Air-HOLP, and Ridge-HOLP with r = 10
summary(result)

result$penalty_adaptive     # the penalty Air-HOLP selected
#> 229.6
result$rank_adaptive[1:4]   # ranks of the 4 true features (top 38 are screened)
#> 1 3 7 2''', after = 'Version 0.1.0 · MIT licence · [AirScreen on CRAN](https://CRAN.R-project.org/package=AirScreen)' },
	{ id = 'maths', heading = 'The method in formulas', fold = 'Show the formulas', fold_points = [
		'**HOLP:** β̂ = Xᵀ(XXᵀ)⁻¹y; features are ranked by |β̂ⱼ| and the top m are kept.',
		'**Ridge-HOLP:** β̂ᵣ = Xᵀ(XXᵀ + rIₙ)⁻¹y, which costs O(n³ + n²p) instead of O(p³ + p²n) for the standard ridge formula.',
		'**Air-HOLP:** r̂ = argmin over 0 ≤ r ≤ c√n of (1/n)‖y₀ − ŷᵣ‖², where y₀ = Xβ is the noise-free signal, estimated by the fitted values of a least-squares fit on the top m′ = ⌈n/log(n)⌉ features.',
		'**Why y₀ and not y:** with y, the solution would always be r̂ = 0, because ŷᵣ = y when r = 0 and p ≥ n; the noise-free signal avoids fitting the noise.',
		'**Solving it:** with XXᵀ = UDₙUᵀ, ŷᵣ = UDₙ(Dₙ + rIₙ)⁻¹Uᵀy, and the first-order condition is solved with Newton’s method; the range r ≤ c√n (c = 1000) keeps the sure screening property of Ridge-HOLP.',
		'**Stopping:** when |rᵢ₊₁ − rᵢ| < δrᵢ₊₁ with δ = 0.01, or after 10 iterations.',
	] },
	{ id = 'next', heading = 'Where it goes next', text = 'Many screening methods use the HOLP formula, including group HOLP, Dynamic Tilted Current Correlation and HOLP-DF, and the paper expects that using Air-HOLP within them will also lead to improvements; the R code already integrates it into group HOLP. The iterative framework may also be extended to other L2-regularised penalties and generalised to non-linear models. Air-HOLP was the first method of my PhD research on feature screening.' },
]
