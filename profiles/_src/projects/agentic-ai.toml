stages = [
	{ title = 'Set the ground truth before automating', status = 'Live', problem = 'A system that writes about me must never claim anything untrue.', decision = 'Before any code, I built a bank of about 150 statements about my work, each approved by me, and a list of claims never to make. The system enforces both in code, not only in the prompt.', rejected = 'Letting an LLM write freely and checking afterwards.', evidence = '' },
	{ title = 'Design first, then build', status = 'Done', problem = 'A system with many parts can drift into inconsistency.', decision = 'A written design with fixed contracts between parts (one database, one message queue, each part with one owner), automated tests and secret scanning on every change, and review before shared code changes.', rejected = '', evidence = 'An independent review before launch found 2 blocking and 12 minor issues; all were fixed before going live.' },
	{ title = 'Screen cheaply, evaluate carefully', status = 'Live', problem = 'Most ads are poor fits, and reading every one with a strong LLM is slow and costly.', decision = 'A cascade. Duplicates are removed and fixed rules applied in code, a fast LLM screens, and a stronger LLM evaluates the rest against my profile, returning structured output that is validated in code.', rejected = 'One strong model on everything.', evidence = '' },
	{ title = 'Go live with a human deciding', status = 'Live', problem = 'Automated applications are a real concern for employers.', decision = 'The system recommends and prepares; I review and submit every application myself.', rejected = '', evidence = 'A review of the first 30 prepared applications found no claim outside the approved facts.' },
	{ title = 'Check the AI against people', status = 'Ongoing', problem = 'An LLM’s ratings can’t be trusted just because they sound reasonable.', decision = 'I grade ads blind, and a weekly sample compares my grades with the AI’s. Any change to the evaluator restarts the comparison.', rejected = '', evidence = '' },
	{ title = 'Cut paid calls without missing good jobs', status = 'Live', problem = 'The AI budget is fixed.', decision = 'Machine-learning filters (XGBoost, and a model built on the fast LLM’s probabilities) decide which ads need the strong LLM. They ran in shadow mode first and switch on only if pre-set limits on missed jobs hold.', rejected = '', evidence = 'In a pilot on 691 ads, about two-thirds of strong-LLM calls were avoided with no good or strong job missed. The first filter on its own saved little; most of the gain came from the second.' },
	{ title = 'Check at the right time, at scale', status = 'Live', problem = 'Jobs appear at different times across thousands of employers’ own sites, and checking everything constantly wastes load and budget.', decision = 'A Bayesian model of when each source posts decides when to check it, and coverage includes the job pages of thousands of employers, checked under a load limit. Data-quality checks catch bad data: decoy links on some sites, which produced thousands of false jobs, were detected and excluded.', rejected = '', evidence = '' },
]
diagram.title = 'Diagram of the system today'
diagram.description = 'Job ads flow from left to right, from cheaper checks to costlier ones: job sources, then clean-up and rules in code, then a machine-learning filter, then a fast LLM screen, then a strong LLM evaluation, and finally me, reviewing and submitting. Approved facts and never-claim rules feed the evaluation and the prepared applications. Two loops feed back: my blind grades go back to the strong LLM evaluation, and a Bayesian timing model decides when each job source is checked. Monitoring, cost limits, backups and tests run underneath everything. The numbers on the diagram are the stages below that added each part.'
