glance = [
	{ value = 'Real-time monitoring', stat = '4×', stat_text = 'the reach of LLM search alone', text = 'Watches organisations’ websites and data feeds around the clock and detects new postings within minutes; a Bayesian model decides when to check each source' },
	{ value = 'Cost-optimised filtering', stat = '95%', stat_text = 'lower AI cost', text = 'Each posting moves from the cheapest checks to the costliest: rules in code, a machine-learning filter, a fast LLM, then a strong LLM, so fewer than 5% of postings ever reach a costly model' },
	{ value = 'Human oversight', stat = '100%', stat_text = 'human-reviewed', text = 'The platform does the monitoring, filtering and drafting, so a person can focus on judgement: they review every shortlist and draft, make every decision, and their blind grades keep the AI’s ratings in check' },
]
stages = [
	{ title = 'Set the ground truth before generating text', problem = 'Text an LLM drafts about real people and organisations must never claim anything untrue.', decision = 'Before any code, a verified knowledge base of about 150 statements, each approved, and a list of claims never to make. Drafts are built only from the knowledge base, and the platform enforces both in code, not only in the prompt.' },
	{ title = 'Design first, then build', problem = 'A system with many parts can drift into inconsistency.', decision = 'The system follows a written design that fixes how its components interact. All components share one database and one message queue, and each component has a single owner. Every change is automatically tested. Any change to code that several components depend on is reviewed before it is accepted.' },
	{ title = 'Check each source at the right time', problem = 'Thousands of organisations post on their own websites, each on its own schedule. Checking every site constantly would overload those sites and waste the budget. Checking too rarely would miss new postings.', decision = 'A Bayesian model estimates how often each organisation posts and checks busier sites more often, timing the checks to the hours when postings tend to appear, with a limit on how often any site is visited.' },
	{ title = 'Screen cheaply, evaluate carefully', problem = 'Most postings do not meet the criteria, and reading every one with a strong LLM is slow and costly on a fixed budget.', decision = 'Items pass through a cascade of filters, each more costly than the last and applied only to the items the previous stage keeps. First, code removes duplicates and applies fixed rules. Next, a machine-learning model filters out items that are unlikely to be relevant. A fast LLM then screens the remaining items, and a second machine-learning model, tested first in shadow mode, decides which of those can skip the strong LLM, within fixed limits on how many good postings it may miss. A stronger LLM evaluates the rest against the criteria. The stronger LLM returns its assessment in a fixed structured format, which code checks before the result is accepted.' },
	{ title = 'Keep a person in charge, and check the AI against them', problem = 'The platform deals with real postings in a person’s name. One unchecked mistake, such as a false claim in a draft, could not be undone, and an AI rating can sound convincing and still be wrong.', decision = 'The platform only recommends postings and drafts applications. A person reads every draft, corrects it where needed and decides whether to send it; the platform never submits anything itself. The person also rates postings without seeing the AI’s rating first, and each week a sample rated by both is compared to measure how often they agree.' },
]
diagram.title = 'Diagram of the system architecture'
diagram.description = 'Postings flow from left to right, from cheaper checks to costlier ones: data sources, then clean-up and rules in code, then a machine-learning filter, then a fast LLM screen, then a strong LLM evaluation, and finally a person, reviewing and deciding. Approved facts and never-claim rules feed the evaluation and the generated drafts. Two loops feed back: blind human grades go back to the strong LLM evaluation, and a Bayesian timing model decides when each source is checked. Monitoring, cost limits, backups and tests run underneath everything.'
