glance = [
	{ value = 'Real-time monitoring', text = 'Watches thousands of organisations’ websites and data feeds around the clock and detects new postings within minutes; a Bayesian model decides when to check each source' },
	{ value = 'Cost-optimised filtering', text = 'Each posting moves from the cheapest checks to the costliest: rules in code, a machine-learning filter, a fast LLM, then a strong LLM, so careful evaluation is spent only where it matters' },
	{ value = 'Human oversight', text = 'The platform does the monitoring, filtering and drafting, so a person can focus on judgement: they review every shortlist and draft, make every decision, and their blind grades keep the AI’s ratings in check' },
]
stages = [
	{ title = 'Set the ground truth before generating text', problem = 'Text an LLM drafts about real people and organisations must never claim anything untrue.', decision = 'Before any code, a verified knowledge base of about 150 statements, each approved, and a list of claims never to make. Drafts are built only from the knowledge base, and the platform enforces both in code, not only in the prompt.' },
	{ title = 'Design first, then build', problem = 'A system with many parts can drift into inconsistency.', decision = 'The system follows a written design that fixes how its components interact. All components share one database and one message queue, and each component has a single owner. Every change is automatically tested. Any change to code that several components depend on is reviewed before it is accepted.' },
	{ title = 'Screen cheaply, evaluate carefully', problem = 'Most postings do not meet the criteria, and reading every one with a strong LLM is slow and costly.', decision = 'Items pass through a cascade of filters, each more costly than the last and applied only to the items the previous stage keeps. First, code removes duplicates and applies fixed rules. Next, a machine-learning model filters out items that are unlikely to be relevant. A fast LLM then screens the remaining items, and a stronger LLM evaluates those that pass against the criteria. The stronger LLM returns its assessment in a fixed structured format, which code checks before the result is accepted.' },
	{ title = 'Keep a person in control of every action', problem = 'The platform deals with real postings. If it acted on its own, a single mistake, such as a false claim in a draft, would go out in the user’s name and could not be undone.', decision = 'The platform only recommends postings and drafts applications. A person reads every draft, corrects it where needed, and decides whether to send it. The platform never submits anything itself.' },
	{ title = 'Check the AI’s ratings against a person’s', problem = 'The AI’s rating of a posting can sound convincing and still be wrong, so it has to be checked against an independent judgement.', decision = 'I rate postings myself without seeing the AI’s rating first. Each week, a sample of postings rated by both of us is compared to measure how often we agree.' },
	{ title = 'Reduce paid AI calls without missing good postings', problem = 'Each call to a paid AI model costs money, and the budget is fixed. Sending every posting to the strongest model would exceed it.', decision = 'Items pass through a cascade of filters, each more costly than the last and applied only to the items the previous stage keeps. First, code removes duplicates and applies fixed rules. A fast LLM then screens the remaining items. Next, machine-learning filters decide which of these need a full evaluation. Only those items go to a stronger LLM, which evaluates them against the criteria. The stronger LLM returns its assessment in a fixed structured format, which code checks before the result is accepted.' },
	{ title = 'Check at the right time, at scale', problem = 'Thousands of organisations post on their own websites, each on its own schedule. Checking every site constantly would overload those sites and waste the budget. Checking too rarely would miss new postings.', decision = 'A Bayesian model estimates how often each organisation posts and checks busier sites more often, timing the checks to the hours when postings tend to appear, with a limit on how often any site is visited.' },
]
diagram.title = 'Diagram of the system today'
diagram.description = 'Postings flow from left to right, from cheaper checks to costlier ones: data sources, then clean-up and rules in code, then a machine-learning filter, then a fast LLM screen, then a strong LLM evaluation, and finally a person, reviewing and deciding. Approved facts and never-claim rules feed the evaluation and the generated drafts. Two loops feed back: blind human grades go back to the strong LLM evaluation, and a Bayesian timing model decides when each source is checked. Monitoring, cost limits, backups and tests run underneath everything.'
