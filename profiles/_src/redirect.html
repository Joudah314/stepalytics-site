<!doctype html>
<html lang="{{site.language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} – {{site.site_name}}</title>
<link rel="canonical" href="{{page_url}}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{target_relative}}">
<script>location.replace(location.protocol === "file:" ? "{{target_relative}}index.html" : "{{target_relative}}" + location.search + location.hash);</script>
<style>body{font:1rem/1.5 system-ui,sans-serif;margin:2rem auto;max-width:36rem;padding:0 1rem}</style>
</head>
<body>
<p>This page has moved to <a href="{{target_relative}}">{{page_url}}</a>.</p>
</body>
</html>
