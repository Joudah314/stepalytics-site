	{ order = 1.0, show = 'page', title = 'Agentic AI job-market monitoring system', id = 'agentic-ai', url = './projects/agentic-ai/', when = '2026', kind = 'Independent project · designed, built and run by me', problem = 'Good jobs appear on hundreds of different sites, and the best ones fill fast.', did_label = 'What I built', approach = 'An agentic AI system that watches thousands of companies around the clock, uses LLMs to judge which jobs fit, and sends notifications to phone.', result = 'New openings are found within minutes, and the AI’s judgement is measured against people’s.', tools = 'Python · SQL · LLMs / GenAI · XGBoost · Bayesian modelling · cloud · CI/CD', links = [
