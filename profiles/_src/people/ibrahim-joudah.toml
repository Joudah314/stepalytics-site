themes = [
	{ title = 'AI and LLM systems', text = 'Building AI tools and testing whether they can be trusted. I build agentic AI systems whose LLM outputs are checked against human judgement, and I use LLMs as a source of prior knowledge, which machine-learning models then update with real data (Bayesian approach). I also use generative AI (GenAI) models to create privacy-preserving synthetic data.', evidence = '[Agentic AI system](./projects/agentic-ai/) · papers in [Computers and Education: AI](https://doi.org/10.1016/j.caeai.2024.100293) and [IEEE ICDH 2026](https://doi.org/10.1109/ICDH72779.2026.00048)' },
	{ title = 'Machine learning and statistical modelling', text = 'Choosing, validating and explaining predictive models: machine learning (e.g., XGBoost), regression, forecasting and anomaly detection, checked with cross-validation and with clear measures of uncertainty. I also develop new statistical methods: my PhD research created a fast way to find the few factors that matter among thousands of variables (feature screening), published in Statistics and Computing.', evidence = '[Air-HOLP paper](https://doi.org/10.1007/s11222-025-10599-6) · [AirScreen on CRAN](https://CRAN.R-project.org/package=AirScreen) · [Informatics paper](https://doi.org/10.3390/informatics11030046)' },
	{ title = 'Data pipelines, analytics and dashboards', text = 'Turning raw data into dependable answers. I build data pipelines in Python and SQL with data-quality checks, automated tests and monitoring, so errors are caught before they reach a decision. I also build interactive dashboards and reports in Tableau that present the results clearly, with their uncertainty and limitations.', evidence = '[StepAlytics dashboards](https://stepalytics.com/activity-explorer/)' },
	{ title = 'Communication, teaching and mentoring', text = 'Making complex analysis clear and useful. I turn technical findings into recommendations for managers and executives, have taught statistics and machine learning at Macquarie University since 2023, and supervised six UTS students through a three-month AI governance project.', evidence = '“He just knows how to teach, and knows what to say and how to say it without making it too confusing.” (student evaluation, 2024)' },
]
