value = 'I build reliable data and AI tools end-to-end, from statistical models and machine learning to an agentic AI system that runs around the clock in the cloud.'
summary = 'I am a data scientist and statistician in Sydney. My latest project is an agentic AI system that finds and rates new job openings around the clock, with its LLM judgements measured against people’s. As a consultant I build privacy-preserving (federated) analysis software in R. I work in Python, SQL and R, and explain results to managers, executives and students. In October 2026 I passed my PhD examination in Statistics at Macquarie University; my research is published in *Statistics and Computing* and released as an R package on CRAN.'
