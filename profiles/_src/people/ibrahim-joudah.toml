value = 'I build reliable data and AI tools end-to-end, from statistical models and machine learning to an agentic AI system that runs around the clock in the cloud.'
summary = 'I’m a data scientist and statistician with a PhD in statistics. My work covers four areas: building **AI and LLM systems**, including agentic AI, and testing whether their outputs can be trusted; **machine learning and statistical modelling**, from choosing and validating models to explaining them; **data pipelines, analytics and dashboards** that turn raw data into dependable answers; and **communication, teaching and mentoring**, so that results are understood and acted on. I work in R, Python and SQL. As a consultant, I build privacy-preserving (federated) analysis software in R, and I teach statistics and machine learning at Macquarie University.'
