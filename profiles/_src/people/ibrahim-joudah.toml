projects = [
	{ order = 1.0, show = 'page', title = 'Agentic AI job-market monitoring system', id = 'agentic-ai', url = './projects/agentic-ai/', when = '2026', kind = 'Independent project · designed, built and run by me', problem = 'Good jobs appear on hundreds of different sites, and the best ones fill fast.', did_label = 'What I built', approach = 'An agentic AI system that watches thousands of companies and other job sources around the clock, uses LLMs to judge which jobs fit, and sends notifications to phone. A machine-learning filter (XGBoost) decides which ads need the paid AI; it was tested in shadow mode before switching on.', result = 'New openings are found within minutes, and the AI’s judgement is measured against people’s. In a pilot on 691 ads, about two-thirds of strong-LLM calls were avoided with no good or strong job missed.', tools = 'Python · SQL · LLMs / GenAI · XGBoost · Bayesian modelling · cloud · CI/CD', links = [
		{ label = 'How it works', url = './projects/agentic-ai/' },
	] },
	{ order = 2.0, show = 'page', title = 'Predicting survey qualification rates with LLMs', id = 'survey-llm', when = '2026', kind = 'Applied AI · predictive modelling', problem = 'How many people will qualify for a new consumer survey, when the topic has no past data to learn from?', approach = 'Asked an LLM for a first estimate from the question wording and location alone, and treated it as data to correct rather than as truth. An R and Python pipeline then combined those estimates with text embeddings and machine learning (XGBoost).', result = 'Prediction error (RMSE) 21% lower than the calibrated LLM estimate alone, in cross-validation on held-out categories. In business terms: how many people a survey needs to recruit to fill its quota, and a rule that flags qualifying questions few people are likely to pass.', tools = 'R · Python · LLMs · text embeddings · XGBoost · cross-validation' },
	{ order = 3.0, show = 'page', title = 'StepAlytics Activity Explorer', url = 'https://stepalytics.com/activity-explorer/', when = '2026', kind = 'Personal project · public dashboards', problem = 'Which patterns in a year of step-tracker data are real, and how much do the weather and a program change daily activity?', approach = 'Python and SQL (DuckDB) workflows with data-quality checks; the weather’s effect measured with regression; the program’s effect with an interrupted time-series design, checked with placebo tests; next-day forecasts tested by time-series cross-validation; two interactive Tableau dashboards.', result = 'The quality checks changed a conclusion: an apparent jump in walking speed came from a change in how the device estimated stride length, not from a gain in fitness. In the published (simulated-data) version, the forecast was 13% more accurate than the best simple rule (mean absolute error).', note = 'Analysed first on my own tracker data, then published with a simulated version of the activity data to protect privacy.', tools = 'Python · SQL (DuckDB) · regression · forecasting · Tableau', links = [
		{ label = 'Open the dashboards', url = 'https://stepalytics.com/activity-explorer/' },
		{ label = 'Tableau Public', url = 'https://public.tableau.com/app/profile/ibrahim.joudah/viz/StepAlyticsActivityExplorer/Patterns' },
		{ label = 'Analysis notes and report (GitHub)', url = 'https://github.com/Joudah314/StepAlytics-Activity-Explorer' },
	] },
	{ order = 4.0, show = 'page', title = 'Air-HOLP and the AirScreen R package', url = './projects/air-holp/', when = '2024–2025', kind = 'Research · first author · method and software', problem = 'In data with thousands of possible factors, such as gene-expression data, find the few that really affect the outcome, even when the factors are strongly related.', approach = 'Created Air-HOLP, which extends an existing screening method (HOLP) with ridge regularisation that tunes itself, so no slow resampling is needed. Tested across many simulated settings and on prostate cancer gene-expression data.', result = 'Published as first author in *Statistics and Computing* (2025) and released on CRAN as AirScreen, an R package with unit tests.', tools = 'R · feature selection · simulation studies · testthat', links = [
		{ label = 'How it works', url = './projects/air-holp/' },
		{ label = 'Paper (Statistics and Computing)', url = 'https://doi.org/10.1007/s11222-025-10599-6' },
		{ label = 'AirScreen on CRAN', url = 'https://CRAN.R-project.org/package=AirScreen' },
	] },
	{ order = 5.0, show = 'more', title = 'Privacy-preserving federated analysis', when = '2026 – now', kind = 'Consulting · Pacific Analytics Consulting', problem = 'Analyse sensitive data held on separate servers without anyone seeing or moving the individual records.', approach = 'Built R functions and packages for DataSHIELD, a platform for federated analysis, that bring multiple imputation for missing data (MICE), survival analysis and regression modelling strategies (rms) to its client-server setup; tested and documented.', result = 'An analyst can run approved analyses on data stored on a separate server and get useful summaries back; only aggregate results that cannot identify anyone are exchanged. The packages are being tested before integration and release.', tools = 'R · DataSHIELD · testthat' },
	{ order = 6.0, show = 'more', title = 'Synthetic data with generative AI', url = 'https://doi.org/10.1016/j.caeai.2024.100293', when = '2024', kind = 'Research · co-author', problem = 'Can synthetic student records protect privacy and still support accurate prediction?', approach = 'Generated synthetic data with generative AI models (CTGAN and CopulaGAN), checked it against the real data (distributions, correlations and principal-component structure), and compared prediction on original, synthetic and combined data. My part: methodology, software and visualisation.', result = 'Published in *Computers and Education: Artificial Intelligence* (2024). I also co-authored research that integrates generative AI with feature selection for high-dimensional cancer classification (IEEE ICDH 2026).', tools = 'CTGAN · CopulaGAN · PCA', links = [
