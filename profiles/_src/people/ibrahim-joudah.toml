themes = [
	{ title = 'AI and LLM systems', text = 'Building AI tools and testing whether they can be trusted. I build agentic AI systems whose LLM outputs are checked against human judgment. I also use generative AI (GenAI) models that create privacy-preserving synthetic data.', evidence = '[Agentic AI system](#agentic-ai) · papers in [Computers and Education: AI](https://doi.org/10.1016/j.caeai.2024.100293) and [IEEE ICDH 2026](https://doi.org/10.1109/ICDH72779.2026.00048)' },
	{ title = 'Machine learning and statistical modelling', text = 'Choosing, validating and explaining predictive models: machine learning (XGBoost), regression and forecasting, checked with cross-validation. My research created a fast method for finding the few factors that matter among thousands (feature screening).', evidence = '[Air-HOLP paper](https://doi.org/10.1007/s11222-025-10599-6) · [AirScreen on CRAN](https://CRAN.R-project.org/package=AirScreen) · [Informatics paper](https://doi.org/10.3390/informatics11030046)' },
	{ title = 'Data pipelines, analytics and dashboards', text = 'Turning raw data into dependable answers: data pipelines in Python and SQL with data-quality checks, automated tests and monitoring, and interactive dashboards and reports that explain uncertainty and limitations.', evidence = '[StepAlytics dashboards](https://stepalytics.com/activity-explorer/)' },
	{ title = 'Explaining results to stakeholders', text = 'Turning technical findings into practical recommendations for managers and executives, and teaching statistics and machine learning at Macquarie University since 2023.', evidence = '“He just knows how to teach, and knows what to say and how to say it without making it too confusing.” (student evaluation, 2024)' },
]
projects = [
	{ order = 1.0, show = 'page', title = 'Agentic AI job-market monitoring system', id = 'agentic-ai', when = '2026', kind = 'Independent project · designed, built and run by me', problem = 'Good jobs appear on hundreds of different sites, and the best ones fill fast.', did_label = 'What I built', approach = 'An agentic AI system that watches thousands of companies and other job sources around the clock, uses LLMs to judge which jobs fit, and sends notifications to phone.', result = 'New openings are found within minutes, the AI’s judgement is measured against people’s, and a machine-learning filter cuts the number of paid AI calls.', how_label = 'Key facts', how = [
		'**Agentic AI with LLMs (GenAI):** an end-to-end system in Python and SQL on a cloud server, running 24/7. It collects job ads from multiple sources, uses LLMs to screen and evaluate each one, and sends notifications to phone.',
		'**LLM evaluation:** I compared the AI’s ratings with human judgements, so its decisions can be trusted and improved over time.',
		'**Machine learning and statistics:** a machine-learning model (XGBoost) reduces paid AI calls; it was tested safely in shadow mode before switching on. Bayesian statistical modelling keeps monitoring fast while keeping server load low.',
		'**Production-grade:** about 1,300 automated tests, CI/CD with Git, monitoring and alerts, cost tracking, and encrypted backups.',
	], tools = 'Python · SQL · LLMs / GenAI · XGBoost · Bayesian modelling · cloud · CI/CD' },
	{ order = 2.0, show = 'page', title = 'Predicting survey qualification rates with LLMs', when = '2026', kind = 'Applied AI · predictive modelling', problem = 'How many people will qualify for a new consumer survey, when the topic has no past data to learn from?', approach = 'Asked a large language model (LLM) for a first estimate from the question wording and location alone, and treated it as data to correct rather than as truth. An R and Python pipeline then combined those estimates with text embeddings and machine learning (XGBoost).', result = 'In cross-validation on held-out categories, prediction error (RMSE) was 21% lower than the calibrated LLM estimate alone. I translated the results into business terms: how many people a survey would need to recruit to fill its quota, and a rule that flags qualifying questions few people are likely to pass.', tools = 'R · Python · LLMs · text embeddings · XGBoost · cross-validation' },
	{ order = 3.0, show = 'page', title = 'StepAlytics Activity Explorer', when = '2026', kind = 'Personal project · public dashboards', problem = 'Which patterns in a year of step-tracker data are real, and how much do the weather and a program change daily activity?', approach = 'Built Python and SQL (DuckDB) workflows with data-quality checks; measured the weather’s effect with regression and the program’s effect with a before-and-after time-series design (interrupted time series, checked with placebo tests); forecast the next day’s activity, tested by time-series cross-validation; and published two interactive Tableau dashboards.', result = 'The quality checks changed a conclusion: an apparent jump in walking speed came from a change in how the device estimated stride length, not from a gain in fitness. In the published (simulated-data) version, the forecast was 13% more accurate than the best simple rule (mean absolute error).', note = 'Analysed first on my own tracker data, then published with a simulated version of the activity data to protect privacy.', tools = 'Python · SQL (DuckDB) · regression · forecasting · Tableau', links = [
		{ label = 'Open the dashboards', url = 'https://stepalytics.com/activity-explorer/' },
		{ label = 'Tableau Public', url = 'https://public.tableau.com/app/profile/ibrahim.joudah/viz/StepAlyticsActivityExplorer/Patterns' },
		{ label = 'Analysis notes and report (GitHub)', url = 'https://github.com/Joudah314/StepAlytics-Activity-Explorer' },
	] },
	{ order = 4.0, show = 'page', title = 'Air-HOLP and the AirScreen R package', when = '2024–2025', kind = 'Research · first author · method and software', problem = 'In data with thousands of possible factors, such as gene-expression data, find the few that really affect the outcome, even when the factors are strongly related.', approach = 'Created Air-HOLP, a statistical method that extends an existing screening method (HOLP) with ridge regularisation that tunes itself, so no slow resampling is needed. Tested it across many simulated settings and on prostate cancer gene-expression data.', result = 'Published as first author in *Statistics and Computing* (2025) and released on CRAN as AirScreen, an R package with unit tests.', tools = 'R · feature selection · simulation studies · testthat', links = [
		{ label = 'Paper (Statistics and Computing)', url = 'https://doi.org/10.1007/s11222-025-10599-6' },
		{ label = 'AirScreen on CRAN', url = 'https://CRAN.R-project.org/package=AirScreen' },
	] },
	{ order = 5.0, show = 'more', title = 'Privacy-preserving federated analysis', when = '2026 – now', kind = 'Consulting · Pacific Analytics Consulting', problem = 'Analyse sensitive data held on separate servers without anyone seeing or moving the individual records.', approach = 'Built R functions and packages for DataSHIELD, a platform for federated analysis, that bring methods such as multiple imputation for missing data (MICE), survival analysis and regression modelling strategies (rms) to its client-server setup; tested and documented.', result = 'The functions let an analyst run approved analyses on data stored on a separate server and get useful summaries back; only aggregate results that cannot identify anyone are exchanged. The packages are being tested before integration and release.', tools = 'R · DataSHIELD · testthat' },
	{ order = 6.0, show = 'more', title = 'Synthetic data with generative AI', when = '2024', kind = 'Research · co-author', problem = 'Can synthetic student records protect privacy and still support accurate prediction of learning outcomes?', approach = 'Generated synthetic data with generative AI models (CTGAN and CopulaGAN), checked it against the real data (distributions, correlations and principal-component structure), and compared prediction on original, synthetic and combined data. My part: methodology, software and visualisation.', result = 'Published in *Computers and Education: Artificial Intelligence* (2024). I also co-authored research that integrates generative AI with feature selection for high-dimensional cancer classification (IEEE ICDH 2026).', tools = 'CTGAN · CopulaGAN · PCA', links = [
		{ label = 'Paper (Computers and Education: AI)', url = 'https://doi.org/10.1016/j.caeai.2024.100293' },
		{ label = 'Cancer classification paper (IEEE ICDH 2026)', url = 'https://doi.org/10.1109/ICDH72779.2026.00048' },
	] },
]
