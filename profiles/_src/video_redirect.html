<!doctype html>
<html lang="{{site.language}}">
<head>
<meta charset="utf-8">
<!-- Built by profiles/_src/build.py from video_redirect.target in profiles/_src/people/{{slug}}.toml: change the video there, then rebuild. -->
<!-- (template: profiles/_src/video_redirect.html) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{video_redirect.title}}</title>
<link rel="canonical" href="{{video_redirect.target}}">
<meta name="robots" content="noindex">
<meta name="description" content="{{video_redirect.description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.site_name}}">
<meta property="og:title" content="{{video_redirect.title}}">
<meta property="og:description" content="{{video_redirect.description}}">
<meta property="og:url" content="{{video_page_url}}">
<meta property="og:image" content="{{video_page_url}}{{video_redirect.thumbnail}}">
<meta property="og:image:width" content="{{video_thumb_width}}">
<meta property="og:image:height" content="{{video_thumb_height}}">
<meta property="og:image:alt" content="{{video_redirect.thumbnail_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="refresh" content="{{#analytics}}2{{/analytics}}{{^analytics}}0{{/analytics}}; url={{video_redirect.target}}">
{{#analytics}}<!-- The visit is counted (GoatCounter's documented image pixel) before the page forwards: on the pixel's
     answer, or after 0.8 s at most, so a slow or blocked counter never stops the video opening. -->
<script>
(function () {
  var target = {{{video_target_js}}}, gone = false;
  function go() { if (!gone) { gone = true; location.replace(target); } }
  try {
    var img = new Image();
    img.onload = img.onerror = go;
    img.src = "https://{{goatcounter_code}}.goatcounter.com/count?p=" + encodeURIComponent(location.pathname) +
      "&t=" + encodeURIComponent(document.title) + "&r=" + encodeURIComponent(document.referrer) +
      "&s=" + encodeURIComponent(screen.width + "," + screen.height + "," + (window.devicePixelRatio || 1)) +
      "&rnd=" + Math.random().toString(36).slice(2);
    setTimeout(go, 800);
  } catch (e) { go(); }
})();
</script>{{/analytics}}{{^analytics}}<script>location.replace({{{video_target_js}}});</script>{{/analytics}}
<style>body{font:1rem/1.5 system-ui,sans-serif;margin:2rem auto;max-width:36rem;padding:0 1rem}</style>
</head>
<body>
<p><a href="{{video_redirect.target}}">{{video_redirect.link_text}}</a></p>
</body>
</html>
